macros:
  - name: cents_to_dollars
    description: A macro that converts dollars to cents and rounds the input decimal places. 
    arguments:
      - name: column_name
        type: string
        description: The name of the column to be converted
      - name: decimals
        type: integer
        description: Number of decimal places, defaults to 2

  - name: grant_select
    description: A macro that grants select privs on schema to a role. 
    arguments:
      - name: schema
        type: string
        description: schema we want to grant privs on, by default is our target schema
      - name: role
        type: string
        description: role we want to grant privs on, by default is our target role